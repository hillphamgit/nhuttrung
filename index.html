<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Từng giọt mưa</title>
<meta name="description" content="Từng giọt mưa gọi nhớ rồi giọt mưa buồn bã">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1418;
    --ink: #f3efe6;
    --ink-soft: rgba(243, 239, 230, .72);
    --accent: #7fc4d6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Lora", Georgia, serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .photo {
    position: relative;
    max-width: 1200px;
    margin: 0 auto;
  }
  .photo img {
    display: block;
    width: 100%;
    height: auto;
  }
  #rain {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .lyrics {
    max-width: 760px;
    margin: 0 auto;
    padding: 56px 16px 72px;
  }
  .lyrics p {
    font-size: clamp(1.2rem, 3vw, 1.9rem);
    line-height: 1.5;
    font-style: italic;
    opacity: 0;
    transform: translateY(14px);
    filter: blur(4px);
    animation: fall-in 1.8s cubic-bezier(.2, .7, .2, 1) forwards;
  }
  .lyrics p + p { margin-top: .9em; }
  .lyrics p:nth-child(1) { animation-delay: .4s; }
  .lyrics p:nth-child(2) { animation-delay: 2s; }
  .lyrics p:nth-child(3) { animation-delay: 3.6s; }
  .lyrics p:nth-child(4) { animation-delay: 5.2s; }
  .lyrics p:nth-child(even) { color: var(--ink-soft); padding-left: 1.2em; }
  .lyrics p:last-child { color: var(--accent); }

  @keyframes fall-in {
    to { opacity: 1; transform: none; filter: none; }
  }

  @media (max-width: 640px) {
    .lyrics { padding: 36px 16px 56px; }
    .lyrics p:nth-child(even) { padding-left: .8em; }
  }

  @media (prefers-reduced-motion: reduce) {
    .lyrics p { animation: none; opacity: 1; transform: none; filter: none; }
    #rain { display: none; }
  }
</style>
</head>
<body>
  <main>
    <figure class="photo">
      <img src="images/nha.webp" width="1436" height="1080" alt="Mái hiên nhà xưa với cửa xanh, giỏ lan treo và chiếc xe máy Honda Wave đỗ trước sân">
      <canvas id="rain" aria-hidden="true"></canvas>
    </figure>
    <section class="lyrics">
      <p>Từng giọt mưa gọi nhớ rồi giọt mưa buồn bã</p>
      <p>Chiều nay không còn nữa giấc mơ ân tình êm ái</p>
      <p>Từng giọt mưa trầm lắng rồi giọt mưa sầu đắng</p>
      <p>Hợp rồi tan thôi đừng mộng mơ khi tình dở dang</p>
    </section>
  </main>

<script>
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var canvas = document.getElementById('rain');
  var ctx = canvas.getContext('2d');
  var drops = [];
  var w, h, dpr;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.clientWidth;
    h = canvas.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var count = Math.round(w * h / 14000);
    drops = [];
    for (var i = 0; i < count; i++) drops.push(makeDrop(true));
  }

  function makeDrop(anywhere) {
    var z = Math.random();
    return {
      x: Math.random() * (w + 100) - 50,
      y: anywhere ? Math.random() * h : -20,
      len: 8 + z * 18,
      speed: 6 + z * 10,
      alpha: .05 + z * .15
    };
  }

  function frame() {
    ctx.clearRect(0, 0, w, h);
    ctx.lineWidth = 1;
    ctx.lineCap = 'round';
    for (var i = 0; i < drops.length; i++) {
      var d = drops[i];
      ctx.strokeStyle = 'rgba(210, 230, 240,' + d.alpha + ')';
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - d.len * .18, d.y + d.len);
      ctx.stroke();
      d.y += d.speed;
      d.x -= d.speed * .18;
      if (d.y > h) drops[i] = makeDrop(false);
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('load', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
